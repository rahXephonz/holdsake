$schema: '../../.moon/cache/schemas/project.json'

tags: ['app']
dependsOn: ['sdk', 'ui']

tasks:
  dev:
    command: 'vite dev --port 4321'
    deps: ['sdk:generate']
    preset: 'server'
  build:
    command: 'vite build'
    deps: ['sdk:generate']
    inputs: ['src/**/*', 'public/**/*', 'vite.config.ts', 'tsconfig.json', 'package.json']
    outputs: ['.output']
  typecheck:
    command: 'tsc --noEmit'
    deps: ['sdk:generate']
