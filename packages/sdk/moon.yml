$schema: '../../.moon/cache/schemas/project.json'

tags: ['sdk']
dependsOn: ['contracts']

tasks:
  generate:
    command: 'wagmi generate'
    deps: ['contracts:build']
    inputs: ['wagmi.config.ts', '/contracts/out/**/*']
    outputs: ['src/generated']
  typecheck:
    command: 'tsc --noEmit'
    deps: ['generate']
  test:
    command: 'vitest run --passWithNoTests'
    deps: ['generate']
