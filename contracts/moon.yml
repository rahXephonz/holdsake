$schema: '../.moon/cache/schemas/project.json'

tags: ['contracts']

# Runs the system Foundry (pinned with foundryup, see AGENT.md). Deploys are never tasks here.
tasks:
  install:
    command: 'forge soldeer install'
    inputs: ['foundry.toml']
    outputs: ['dependencies']
  build:
    command: 'forge build'
    deps: ['install']
    inputs: ['src/**/*', 'test/**/*', 'script/**/*', 'foundry.toml', 'remappings.txt']
    outputs: ['out']
  test:
    command: 'forge test --no-match-path "test/verify/*"'
    deps: ['build']
  gas:
    command: 'forge test --gas-report --no-match-path "test/verify/*"'
    deps: ['build']
    options:
      cache: false
  lint:
    command: 'forge fmt --check'
  verify:
    # "Verify first" checks against a Robinhood Chain fork. Needs ROBINHOOD_RPC_URL; spends nothing.
    # prague so vm.signAndAttachDelegation (EIP-7702) works; the chain's ArbOS 61 supports it.
    # The rate-limit flags keep a free-tier RPC from returning 429s mid-run.
    command: 'forge test --match-path "test/verify/*" --evm-version prague --fork-url $ROBINHOOD_RPC_URL --compute-units-per-second 50 --fork-retries 10 --fork-retry-backoff 2000 -vv'
    deps: ['build']
    options:
      cache: false
      envFile: '/apps/app/.env'
  fork:
    command: 'anvil --fork-url $ROBINHOOD_RPC_URL --chain-id 4663'
    preset: 'server'
    options:
      envFile: '/apps/app/.env'
